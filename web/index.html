<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Knellroot</title>
  <style>
    html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: absolute; background: black; z-index: 0;
      touch-action: none; overscroll-behavior: none; user-select: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- 레포 복사본(핫링크 금지, nail web/README.md). macroquad 0.4.16과 같은 줄기. -->
  <script src="mq_js_bundle.js"></script>
  <!-- gamepads 크레이트 플러그인(nail에서 두 곳 고친 복사본: 버전 정수, 비표준 매핑 허용). -->
  <script src="macroquad-gamepads-0.1.js"></script>
  <script>
    // 처음 장치가 터치인지(폰·태블릿): 아무것도 만지기 전 첫 화면부터 터치 버튼을 보이게(src/input.rs initial_device).
    miniquad_add_plugin({
      name: "knell_device",
      version: 1,
      register_plugin: function (importObject) {
        importObject.env.knell_coarse_pointer = function () {
          try { return window.matchMedia("(pointer: coarse)").matches ? 1 : 0; } catch (e) { return 0; }
        };
        // 설정 저장(src/prefs.rs, 0024): 정수 칸 i ↔ localStorage "knell.pref.i". 없으면 0. 막히면(사생활 보호 모드 등) 저장하지 않는다.
        importObject.env.knell_pref_get = function (i) {
          try { var v = parseInt(window.localStorage.getItem("knell.pref." + i), 10); return isNaN(v) ? 0 : (v >>> 0); } catch (e) { return 0; }
        };
        importObject.env.knell_pref_set = function (i, v) {
          try { window.localStorage.setItem("knell.pref." + i, String(v >>> 0)); } catch (e) {}
        };
        // 전체 화면(src/screen.rs, 0046 — nail 0269와 같은 방식): 문서 전체를 올리고, 들어간 뒤 가로 잠금을 시도(Android Chrome), 안 되면 조용히.
        // 브라우저는 사용자 입력 직후에만 허락한다 — 게임이 메뉴를 고른 그 프레임에 부른다.
        function fsEnabled() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
        function fsActive() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
        function lockLandscape() {
          try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
        }
        function enterFs() {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          try {
            var p = req && req.call(el, { navigationUI: "hide" });
            if (p && p.then) p.then(lockLandscape).catch(function () {}); else lockLandscape();
          } catch (e) {}
        }
        importObject.env.knell_fs_enabled = function () { return fsEnabled() ? 1 : 0; };
        importObject.env.knell_fs_active = function () { return fsActive() ? 1 : 0; };
        importObject.env.knell_fs_toggle = function () {
          try {
            if (fsActive()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else enterFs();
          } catch (e) {}
        };
        importObject.env.knell_fs_touch_enter = function () {
          var coarse = false;
          try { coarse = window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
          if (coarse && fsEnabled() && !fsActive()) enterFs();
        };
      }
    });
    load("knellroot.wasm");
  </script>
</body>
</html>
