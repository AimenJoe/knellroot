[package]
name = "knellroot"
version = "0.0.1"
authors = ["Beardworks"]
edition = "2021"
description = "Knellroot — 레트로 로우폴리 3D ARPG(쿼터뷰 떼싸움 + 락온 보스전) PoC"
publish = false

[features]
# dev: 랩·개발 시나리오 전환 키. 운영판은 --no-default-features (nail 0193의 규칙 그대로).
default = ["dev"]
dev = []

[dependencies]
macroquad = { version = "0.4.16" }
# P4 스파이크(0013): glTF 읽기. 기본 기능(import = 파일·image 크레이트)은 끄고 JSON + 접근자만 — data URI는 base64로 직접 푼다.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
base64 = "0.22"

# nail과 같은 까닭: gamepads 0.1.7은 Android에서 컴파일되지 않는다(패드는 miniquad 패치가 키로 넘긴다).
[target.'cfg(not(target_os = "android"))'.dependencies]
gamepads = { version = "0.1.7", default-features = false }

[dev-dependencies]
# 시험만: i18n 표의 모든 글자가 글꼴에 있는지(첫 게임 규칙).
ttf-parser = "0.25"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
