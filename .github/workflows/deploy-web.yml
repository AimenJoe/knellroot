name: deploy-web
# 웹 빌드·배포(nail deploy-web.yml에서 가져옴, Knellroot 0005·0022). 갈래(nail 0193, v0.1.0부터):
# - main push: 운영판 → Cloudflare `knellroot.beardworks.io/play/`(publish 잡, 0246), 옛 Netlify 운영 주소는 기록 넘김 페이지.
# - release/** push: 개발판 — 개발 기능(랩·개발 항목)을 켠 빌드를 같은 사이트의 별칭 `dev`(dev--knellroot.netlify.app)에.
#   운영과 주소(= 브라우저 저장소)가 달라 기록이 섞이지 않는다. 올린 뒤 그 주소의 build.txt가 이 커밋인지 확인한다.
# - PR: 개발판을 pr-<번호> 별칭에(포크 PR은 시크릿이 없어 건너뜀).
# 어느 갈래든 fmt·clippy(두 갈래)·test·wasm·조립·헤드리스 연기 시험을 먼저 돈다.
# 잡 넷(0271): compile(검사·빌드·조립) → smoke(헤드리스 — 스크립트마다 러너 하나씩 나란히) → build(문지기 + 개발판 올리기) → publish(main).
# 헤드리스는 소프트웨어 GL이라 화소 수만큼 느리고 한 러너(공개 레포 = 4 vCPU·16GB)의 코어를 다 쓴다 — 한 러너에서 나란히 돌리지 않고
# 잡을 나눈다(잡마다 제 러너). main은 PR 검사에서 긴 시나리오를 이미 돌았으니 **실제로 나가는 운영 빌드**만 띄워 본다(boot·pwa).
# 배포는 사장이 정한다(main에 push하면 바로 올라간다).
# 액션 버전: Node 24로 도는 메이저(checkout·setup-node·upload-artifact v7, rust-cache v2 — v7의 깨지는 변경(pull_request_target 포크 checkout 거부, NODE_AUTH_TOKEN 대체값 제거)은 이 워크플로에 해당 없음, upload-artifact v7 archive 기본 true) — Node 20 액션은 2026-06-16부터 강제로 Node 24, 2026-09-23 제거(GitHub changelog 2025-09-19). upload-artifact v5는 아직 node20.
on:
  push:
    branches: [main, 'release/**']
    # 문서만 바뀐 push는 돌지 않는다(0264). docs/tuning-frozen.txt는 cargo test가 읽으니 다시 넣는다.
    # pull_request에는 거르개를 두지 않는다 — main 룰셋의 필수 검사 `build`가 문서만 고친 PR에서도 와야 Merge된다.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'docs/tuning-frozen.txt'
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    # 러너는 최신 그대로(0279): 게임의 초월 함수는 `libm` 크레이트를 지나므로(`src/det.rs`) 트레이스 고정값이 glibc 판과 상관없다.
    # 2026-11-26에 26.04에서 `scenario_traces` · `fx_traces`가 갈린 까닭이 시스템 libm이었다 — 다시 갈리면 std 수학이 새어 든 것이다.
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.flavor.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 운영판은 개발 기능을 뺀다(nail 0193). 다른 갈래는 기본값(dev).
      # smoke = 뒤의 헤드리스 잡이 돌 스크립트 묶음(매트릭스). 운영판에는 개발 항목이 없어 긴 시나리오를 못 돈다 — 그 대신 boot.
      - name: Build flavor
        id: flavor
        run: |
          echo "runner: $(nproc) vCPU, $(free -g | awk '/^Mem:/{print $2}') GB"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"; echo "FLAVOR=release" >> "$GITHUB_ENV"
            echo 'smoke=["boot"]' >> "$GITHUB_OUTPUT"
          else
            echo "FEATURES=" >> "$GITHUB_ENV"; echo "FLAVOR=dev" >> "$GITHUB_ENV"
            echo 'smoke=["shot","touch","save","pwa"]' >> "$GITHUB_OUTPUT"
          fi

      - run: cargo fmt --all -- --check
      # 두 갈래 다 경고가 없어야 한다(dev 전용 코드가 운영판에서 죽은 코드가 되지 않게).
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings
      # Android에서만 깨지는 것(cfg(target_os = "android") 경로·의존성)을 APK 빌드 전에(0022). NDK 없이 된다.
      - run: cargo clippy --target aarch64-linux-android --no-default-features -- -D warnings
      - name: Install Linux libs for host tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev pkg-config
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown $FEATURES

      - name: Assemble publish dir
        run: |
          sh tools/web/assemble.sh dist "$GITHUB_SHA" "$FLAVOR"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 운영 주소 /play 판(0246): 같은 빌드를 /play 기준으로 조립하고(_headers 경로만 다르다) 옛 주소의 넘김 페이지도.
      # Cloudflare 설정은 토큰 없이 dry-run으로 모든 갈래·PR에서 본다 — 토큰은 운영 환경(web-production, main만)에.
      - name: Assemble /play and moved page, check Cloudflare config
        run: |
          sh tools/web/assemble.sh dist-play "$GITHUB_SHA" "$FLAVOR" /play
          sh tools/web/assemble.sh dist-moved "$GITHUB_SHA" moved
          cp tools/web/wrangler.jsonc .
          npx -y wrangler@4.156.2 deploy --dry-run --outdir /tmp/cf-dry
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-play
          path: |
            dist-play
            dist-moved

  # 연기 시험(nail 0169 R7): 헤드리스 Chromium으로 콘솔 에러·패닉을 잡고 스크린숏을 남긴다. 스크립트 묶음마다 잡 하나.
  # - shot: 시나리오 넷·락온·랩(그림을 보는 스크립트 — 제 화질). touch: 가로 폰(844×390, DPR 3) 스틱·버튼·랩 터치판(0006).
  # - save: 기록 — 이어하기·처음부터·새로 하기(0064 M2). pwa: 로딩 화면·매니페스트·서비스 워커·오프라인(0062) + 앱이 내려감(0257).
  # - boot(main만): 운영 빌드가 타이틀까지 뜨고 개발 메뉴가 없고 새 판이 돈다 + pwa.
  # shot 밖의 스크립트는 `sceneKit.cheap`(월드 줄 수 270·2배 그리기 끔)으로 돈다 — 같은 러너에서 3배 빠르다.
  smoke:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.compile.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/test
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.47.2 >/dev/null
          # Ubuntu 패키지 서버가 가끔 503을 낸다(2026-11-19 R8a 실행이 글꼴 받기에서 멈췄다) — 깔기만 세 번까지 다시 한다.
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "playwright install 실패($i) — $((i * 30))초 뒤 다시"; sleep $((i * 30))
          done
      - name: Headless smoke (${{ matrix.script }})
        run: |
          case "${{ matrix.script }}" in
            shot) node tools/test/shot.js dist shots ;;
            touch) node tools/test/touch.js dist shots ;;
            save) node tools/test/save.js dist shots ;;
            pwa) node tools/test/pwa.js dist shots && node tools/test/away.js dist shots ;;
            boot) node tools/test/boot.js dist shots && node tools/test/pwa.js dist shots ;;
            *) echo "모르는 묶음 ${{ matrix.script }}"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: shots-${{ matrix.script }}
          path: shots
          if-no-files-found: ignore

  # 잡 이름 = main 룰셋의 필수 검사 이름(0092 — nail `main-only`를 그대로 가져와 `build`). 앞의 둘이 다 지나야 초록이다 —
  # 앞이 실패해도 이 잡은 돌아서(건너뛴 필수 검사는 "통과"로 읽힌다) 빨갛게 답한다. 개발판·PR 미리보기도 여기서(시험이 지난 뒤에만).
  build:
    needs: [compile, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Gate
        run: |
          echo "compile: ${{ needs.compile.result }} · smoke: ${{ needs.smoke.result }}"
          if [ "${{ needs.compile.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "::error::검사·빌드(compile) 또는 헤드리스 시험(smoke)이 지나지 않았다"; exit 1
          fi
      - uses: actions/download-artifact@v7
        if: env.NETLIFY_SITE_ID != '' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/'))
        with:
          name: web-dist
          path: dist
      - uses: actions/setup-node@v7
        if: env.NETLIFY_SITE_ID != '' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/'))
        with:
          node-version: 22

      # Netlify 시크릿이 설정되기 전에는 아래 단계가 건너뛰어진다(빌드 검증만). KB reference/netlify/deploy-from-ci.md.
      # 개발판(nail 0193): 운영(--prod)은 건드리지 않는다. 올린 뒤 별칭 주소의 build.txt가 이 커밋인지 확인한다(아니면 실패).
      - name: Deploy dev (alias)
        if: env.NETLIFY_SITE_ID != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          npx netlify-cli@23 deploy --dir=dist --alias=dev --message="${{ github.ref_name }} ${{ github.sha }}" --json > deploy.json
          cat deploy.json
          url=$(node -e 'const j=require("./deploy.json"); const u=(j.deploy_url||"").replace(/\/$/,""); console.log(u.includes("://dev--") ? u : "https://dev--"+j.site_name+".netlify.app")')
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "$url/build.txt?t=$(date +%s)" || true)
            echo "try $i: $got"
            case "$got" in "$GITHUB_SHA"*) ok=1; break;; esac
            sleep 10
          done
          if [ -z "$ok" ]; then echo "::error::$url 이 이 커밋($GITHUB_SHA)을 가리키지 않는다"; exit 1; fi
          echo "### 개발판: $url (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy PR preview
        if: env.NETLIFY_SITE_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        run: npx netlify-cli@23 deploy --dir=dist --alias="pr-${{ github.event.number }}"

  # 운영 배포(0246): 게임은 Cloudflare Worker web-game-knellroot = https://knellroot.beardworks.io/play/, 옛 Netlify 운영 주소는
  # 기록을 들고 새 주소로 보내는 넘김 페이지(web/moved/). 순서가 중요하다 — 새 주소가 이 커밋을 내주는 것을 본 뒤에만 옛 주소를 바꾼다
  # (앞이 실패하면 옛 주소의 게임이 그대로 남는다). Cloudflare 토큰은 Environment `web-production`(Deployment branches = main)에만.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: web-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/web
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: web-play
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::error::web-production 환경에 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID가 없다"; exit 1
      - name: Deploy production (Cloudflare /play)
        run: |
          cp tools/web/wrangler.jsonc .
          npx -y wrangler@4.156.2 deploy
          bash tools/web/check_live.sh https://knellroot.beardworks.io/play "$GITHUB_SHA"
          echo "### 운영판: https://knellroot.beardworks.io/play/ (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand over old address (Netlify production → moved page)
        if: env.NETLIFY_SITE_ID != ''
        run: |
          npx netlify-cli@23 deploy --no-build --dir=dist-moved --prod --message="moved ${{ github.sha }}"
          bash tools/web/check_live.sh https://knellroot.netlify.app "$GITHUB_SHA"
          echo "### 옛 주소: https://knellroot.netlify.app → 넘김 페이지" >> "$GITHUB_STEP_SUMMARY"
