name: build-android
# Android APK(0022). 첫 게임 nail의 build-android.yml에서 가져옴 — 비공개 에셋·웹 전용 소리 단계는 없다(이 레포엔 없음).
# cargo-quad-apk로 miniquad의 MainActivity(패치본 third_party/miniquad)를 포함한 APK를 만든다. KB guides/macroquad-android-apk-github-actions.md.
# - main push(관련 파일이 바뀔 때)·수동 실행: 디버그 키로 서명한 APK를 Actions 아티팩트로.
# - release.yml이 부를 때(release_tag): 같은 APK를 GitHub Release에.
# 갈래(nail 0193): main·release_tag = 운영판(--no-default-features, io.github.aimenjoe.knellroot).
#   그 밖(release/** push, 작업 브랜치 수동 실행) = 개발판: 개발 기능을 넣고 패키지를 `.dev`로 바꿔 운영 앱과 나란히 깔린다.
#   release/** push면 미리 보기 릴리스 `dev`의 `knellroot-dev.apk`를 갈아 끼운다.
# 러너(ubuntu-latest)에 Android SDK(build-tools, platforms;android-36)·NDK·JDK 17이 미리 깔려 있다.
# 액션 판: node24 메이저(KB reference/github-actions/node24-action-runtime.md).
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android/**'        # 앱 아이콘
      - 'third_party/**'    # 패치한 miniquad
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
  # release.yml(버전 올리기 = 릴리스)이 태그를 만든 뒤 부른다.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

concurrency:
  group: android-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  # not-fl3/cargo-quad-apk master, 2026-07-28 (NDK 29 lib64 대응, API 36). nail과 같은 커밋.
  CARGO_QUAD_APK_REV: d411c8fe1c08339e46d7dc6b40ac04ea5e3a01b6

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release 만들기·dev 미리 보기 갈아 끼우기
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-quad-apk binary
        id: cqa
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-quad-apk
          key: cargo-quad-apk-${{ runner.os }}-${{ env.CARGO_QUAD_APK_REV }}
      - name: Install cargo-quad-apk
        if: steps.cqa.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/not-fl3/cargo-quad-apk --rev "$CARGO_QUAD_APK_REV"

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          java -version

      # 서명 키를 빌드마다 바꾸면 기기에서 이전 빌드 위에 설치할 수 없다("패키지가 유효하지 않음").
      # 우선순위: Secrets의 키 → Actions 캐시에 남은 키(7일 안 쓰면 지워짐) → 새로 생성(경고).
      - name: Restore debug keystore from cache
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Install debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "keystore: from secret ANDROID_DEBUG_KEYSTORE_B64"
          elif [ -f ~/.android/debug.keystore ]; then
            echo "::warning::keystore: Actions 캐시에서(7일 안 쓰면 지워진다). ANDROID_DEBUG_KEYSTORE_B64 시크릿을 넣으면 고정된다(docs/release.md)."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 시크릿이 없어 새 디버그 키를 만든다. 이전 빌드 위에 설치하려면 기기에서 먼저 삭제해야 한다."
          fi

      - name: Build flavor
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"; echo "FLAVOR=release" >> "$GITHUB_ENV"
          else
            echo "FEATURES=" >> "$GITHUB_ENV"; echo "FLAVOR=dev" >> "$GITHUB_ENV"
            # 운영 앱 위에 덮어 깔리지 않게 패키지·이름을 바꾼다(빌드 안에서만, 커밋하지 않는다).
            # 패키지 이름의 **마지막 조각은 knellroot로 둔다**: cargo-quad-apk가 그것을 네이티브 라이브러리 이름으로 써서
            # (MainActivity의 System.loadLibrary) `….knellroot.dev`는 libdev.so를 찾다 켜자마자 죽었다(2026-11-07, android-smoke logcat).
            sed -i -e 's/^package_name = "io.github.aimenjoe.knellroot"$/package_name = "io.github.aimenjoe.dev.knellroot"/' \
                   -e 's/^label = "Knellroot"$/label = "Knellroot dev"/' Cargo.toml
            grep -q 'package_name = "io.github.aimenjoe.dev.knellroot"' Cargo.toml
          fi
          grep -n '^package_name\|^label\|^version_code' Cargo.toml

      - name: Build APK (release, debug-signed)
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          cargo quad-apk build --release $FEATURES
          ls -la target/android-artifacts/release/apk

      - name: Verify APK (signature, manifest, ABI, icon)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=target/android-artifacts/release/apk/knellroot.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|native-code|launchable-activity|application-label|application-icon" || true
          # targetSdk 31+: android:exported가 없으면 Android 12+ 기기가 설치를 거부한다(nail 0074 — 서명·badging 검사로는 안 잡힌다).
          if ! "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q "android:exported"; then
            echo "::error::AndroidManifest의 MainActivity에 android:exported가 없다(Android 12+에서 설치 실패)"; exit 1
          fi
          if ! "$BT/aapt2" dump badging "$APK" | grep -q "application-icon"; then
            echo "::error::APK에 앱 아이콘이 없다(Cargo.toml의 res·icon, android/res)"; exit 1
          fi
          # MainActivity가 loadLibrary하는 이름 = 패키지 이름의 마지막 조각(cargo-quad-apk). 그 .so가 APK에 없으면 켜자마자 죽는다.
          PKG=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/lib${PKG##*.}.so"; then
            echo "::error::패키지 $PKG → MainActivity가 lib${PKG##*.}.so를 찾는데 APK에 없다(패키지 이름의 마지막 조각 = 라이브러리 이름)"; exit 1
          fi
          unzip -l "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: knellroot-apk-${{ env.FLAVOR }}-${{ github.sha }}
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: target/android-artifacts/release/apk/*.apk
          # 릴리스 본문 = docs/releases/<태그>.md(먼저 커밋). 커밋 목록은 아래에 붙는다.
          body_path: docs/releases/${{ inputs.release_tag }}.md
          generate_release_notes: true

      # 개발판 내려받기 자리(nail 0193): 미리 보기 릴리스 `dev` 하나를 계속 갈아 끼운다.
      # 주소: releases/download/dev/knellroot-dev.apk. releases/latest는 미리 보기를 건너뛴다.
      - name: Publish dev APK (prerelease `dev`)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/android-artifacts/release/apk/knellroot.apk knellroot-dev.apk
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
          notes="개발판 — \`${GITHUB_REF_NAME}\` ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%dT%H:%MZ)). 운영판과 따로 깔리는 Knellroot dev(io.github.aimenjoe.dev.knellroot), 개발 메뉴·랩 포함. 운영판은 Latest 릴리스."
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --title "개발판 (${GITHUB_REF_NAME})" --notes "$notes"
          else
            gh release create dev --prerelease --title "개발판 (${GITHUB_REF_NAME})" --notes "$notes" --verify-tag
          fi
          gh release upload dev knellroot-dev.apk --clobber
          echo "### 개발판 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/knellroot-dev.apk (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
