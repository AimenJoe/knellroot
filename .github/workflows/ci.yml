name: ci
# 첫 게임 deploy-web.yml에서 배포만 뺀 것. fmt·clippy(두 갈래)·test·wasm 빌드·조립·헤드리스 스크린숏(아티팩트).
on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: Install Linux libs for host tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev pkg-config
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: sh tools/web/assemble.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless screenshots
        run: |
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium
          node tools/test/shot.js dist shots
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
